name: Build issue

# Editors run this from the Actions tab: pick a month, press Run.
on:
  workflow_dispatch:
    inputs:
      month:
        description: 'Month to build, as YYYY-MM (e.g. 2026-09)'
        required: true
        type: string
      style:
        description: 'Page layout'
        required: true
        default: twocol
        type: choice
        options: [twocol, classic, editorial]
      cover:
        description: >-
          Cover page. An image uploaded to covers/<month>.jpg is used
          automatically and beats "title"; "blank" beats both.
        required: true
        default: title
        type: choice
        options: [title, blank]
      publish:
        description: 'Publish the mobile web version to the site'
        required: true
        default: true
        type: boolean

concurrency:
  group: build-issue-${{ inputs.month }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check the month looks like YYYY-MM
        run: |
          echo "${{ inputs.month }}" | grep -Eq '^[0-9]{4}-[0-9]{2}' \
            || { echo "::error::Month must look like 2026-09"; exit 1; }

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Install the browser
        # Playwright ships a pinned Chromium, so the build does not depend on
        # whatever Chrome version the runner image happens to carry
        run: python -m playwright install --with-deps chromium

      - name: Fetch the month's articles
        working-directory: pipeline
        run: |
          set -o pipefail    # otherwise tee's exit code hides a failed fetch
          python fetchparse.py "${{ inputs.month }}" | tee fetch.log

      - name: Build the A4 PDF and the Canva file
        working-directory: pipeline
        env:
          PN_STYLE: ${{ inputs.style }}
          PN_COVER: ${{ inputs.cover }}
        run: ./build.sh "${{ inputs.month }}"

      - name: Update the author pages
        # Runs before the web build so the issue's bylines can link to them.
        # Reads the whole year from the site, so it picks up the new month too.
        if: inputs.publish
        working-directory: pipeline
        run: python authors.py .. "${{ inputs.month }}"

      - name: Build the mobile web version
        working-directory: pipeline
        env:
          PN_STYLE: ${{ inputs.style }}
          PN_COVER: ${{ inputs.cover }}
        run: python web.py "${{ inputs.month }}"

      - name: Collect the outputs
        id: out
        working-directory: pipeline
        env:
          PN_STYLE: ${{ inputs.style }}
          PN_COVER: ${{ inputs.cover }}
        run: |
          KEY="${{ inputs.month }}"
          NAME=$(python -c "from issues import resolve; print(resolve('$KEY')['out'])")
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          mkdir -p ../out
          cp "build/$NAME.pdf" ../out/
          # the Canva file is optional — the build warns and skips it if the
          # layout extraction misbehaves, and that must not fail the run
          if [ -f "build/${NAME}_canva.pptx" ]; then
            cp "build/${NAME}_canva.pptx" ../out/
          else
            echo "::warning::Canva file was not produced; the PDF is unaffected."
          fi
          if [ "${{ inputs.publish }}" = "true" ]; then
            mkdir -p "../docs/$KEY"
            cp "build/web-$KEY.html" "../docs/$KEY/index.html"
            cp "build/$NAME.pdf" "../docs/$KEY/"
            python mksite.py "$KEY" ..
          fi

      - name: Upload the PDF and Canva file
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.out.outputs.name }}
          path: out/*
          retention-days: 90

      - name: Publish the web version
        if: inputs.publish
        run: |
          git config user.name  "palakneeti-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "Nothing changed on the site."
            exit 0
          fi
          git commit -m "अंक ${{ inputs.month }} — mobile edition"
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "published on attempt $attempt"
              exit 0
            fi
            echo "push rejected — another build published first; rebasing"
            git pull --rebase origin main
          done
          echo "::error::could not publish the site after 5 attempts"
          exit 1

      - name: Summary
        run: |
          {
            echo "## पालकनीती ${{ inputs.month }}"
            echo
            sed -n 's/^/    /p' pipeline/fetch.log | head -30
            echo
            echo "Layout: \`${{ inputs.style }}\`  ·  Cover: \`${{ inputs.cover }}\`"
            echo
            echo "The PDF and the Canva file are under **Artifacts** at the bottom of this page."
            if [ "${{ inputs.publish }}" = "true" ]; then
              echo "The mobile edition is published to the site (give Pages a minute)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
